# TerraceRoute — pakai Ollama yang SUDAH jalan di host (dengan qwen2.5 + bge-m3).
# Tidak membundel Ollama sendiri: reuse yang lokal, tak perlu pull ulang model.
# Jalankan:  FIREWORKS_API_KEY=xxx docker compose up --build
# App -> http://localhost:8000 ; menembak Ollama host di :11434 (network_mode: host).
services:
  terraceroute:
    build: .
    network_mode: host
    volumes:
      - ./artifacts:/app/artifacts      # calibrator.json persist ke host
    environment:
      OLLAMA_HOST: http://localhost:11434
      LOCAL_MODEL: ${LOCAL_MODEL:-qwen2.5:14b-instruct}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      OLLAMA_LOGPROBS: ${OLLAMA_LOGPROBS:-true}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-changeme}
      FIREWORKS_BASE_URL: ${FIREWORKS_BASE_URL:-https://api.fireworks.ai/inference/v1}
      REMOTE_MODEL: ${REMOTE_MODEL:-accounts/fireworks/models/qwen2p5-72b-instruct}
      TAU1: ${TAU1:-0.20}
      TAU2: ${TAU2:-0.65}
      ACCURACY_FLOOR: ${ACCURACY_FLOOR:-0.80}
      CROSS_MODEL: ${CROSS_MODEL:-true}
      VERIFIER_MODELS: ${VERIFIER_MODELS:-gemma3:12b}
